services:

  platform:
    image: registry.tudelft.nl/digipedia/tudelft-tutorial-platform-wordpress:${IMAGE_TAG}
    restart: unless-stopped
    container_name: platform-wordpress
    volumes:
      - .plugin-env:/var/www/html/web/app/mu-plugins/tudelft-tutorial-platform-plugin/.env
      - ./wp-content/uploads:/var/www/html/web/app/uploads
    env_file:
      - .env
    ports:
      - 8000:80
    networks:
      - web
    
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/local.sql:/docker-entrypoint-initdb.d/local.sql
    user: "${DOCKER_UID}:${DOCKER_GID}"
    networks:
      - web

  adminer:
    image: adminer
    ports:
      - 9090:8080
    networks:
      - web

volumes:
  db_data:

networks:
  web: