name: OWASP ZAP Scheduled DAST Scan (development)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: ZAP Baseline Scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: development
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'https://alt.viamsterdam.dev/tudelft-tutorials-staging/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'