name: Build and Push Docker image

on:
  push:
    branches:
      - feat/ci-fixes
      - staging
      - development

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Clone plugin
      #   uses: actions/checkout@v4
      #   with:
      #     repository: Studio-Vi-Amsterdam/tudelft-tutorial-platform-plugin
      #     ref: development
      #     path: ./web/app/plugins/
      #     token: ${{ secrets.PLUGIN_GH_PAT }}

      - name: Dump auth.json
        run: echo "${{ secrets.COMPOSER_AUTH_SECRET }}" > $(pwd)/auth.json && ls 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ github.event.repository.name }}:latest
          build-args: |
            NODE_ENV=production
          secrets: |
            "composer_secret"=${{ secrets.COMPOSER_AUTH_SECRET}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Remote deploy on target machine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            ENVIRONMENT=$(if [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then echo "staging"; elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then echo "production"; else echo "Unknown"; fi)
            ENVIRONMENT=staging
            echo "Calling deploy-$ENVIRONMENT action."
            curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-'$ENVIRONMENT'","client_payload":{"tag":"'${{ github.sha }}'"}}'