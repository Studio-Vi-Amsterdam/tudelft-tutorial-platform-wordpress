name: Build and Push Docker image

on:
  push:
    branches:
      - staging
      - development
  workflow_dispatch:
    inputs:
      no_cache:
        description: Rebuild every layer, ignoring the build cache
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          repository: Studio-Vi-Amsterdam/tudelft-tutorial-platform-plugin
          ref: development
          path: ./web/app/mu-plugins/tudelft-tutorial-platform-plugin/
          token: ${{ secrets.PLUGIN_GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Changes every ISO week so the cached `apk upgrade` layer is rebuilt with fresh security patches
      - name: Compute cache-bust week
        id: week
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ inputs.no_cache == true }}
          platforms: linux/amd64
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ github.event.repository.name }}:latest
          build-args: |
            NODE_ENV=production
            APK_CACHE_BUST=${{ steps.week.outputs.value }}
          secrets: |
            "composer_secret=${{ secrets.COMPOSER_AUTH_SECRET}}"
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.event.repository.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Remote deploy on target machine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            ENVIRONMENT="Unknown"
            if [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then 
              ENVIRONMENT="staging"
            elif [[ "${{ github.ref }}" == "refs/heads/development" ]]; then 
              ENVIRONMENT="development"
            elif [[ "${{ github.ref }}" == "refs/heads/production" ]]; then 
              ENVIRONMENT="production"
            else 
              ENVIRONMENT="Unknown"
            fi

            echo "Calling deploy-$ENVIRONMENT action."
            curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-'$ENVIRONMENT'","client_payload":{"tag":"'${{ github.sha }}'"}}'